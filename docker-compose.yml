services:
  postgres:
    image: postgres:16-alpine
    container_name: notification-gateway-postgres
    environment:
      POSTGRES_DB: notification_gateway
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
